[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agent-flywheel"
version = "0.9.0"
description = "Hermes-native local flywheel plugin"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nous Research" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["hermes_flywheel_plugin*"]

[tool.setuptools.package-data]
hermes_flywheel_plugin = ["plugin.yaml", "skills/**/*.md"]
